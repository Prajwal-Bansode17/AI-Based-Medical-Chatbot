services:
  - type: web
    name: medassist-custom-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir ml api:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_CLOUD_GEMINI
        value: "false"
      - key: HF_ENABLE_REMOTE_INFERENCE
        value: "false"
      - key: AI_PRIMARY_PROVIDER
        value: auto
